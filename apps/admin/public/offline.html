<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Ademy is offline</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 0;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        max-width: 560px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #cbd5f5;
      }
      button {
        background: #38bdf8;
        border: none;
        color: #0f172a;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>You are offline</h1>
        <p>We can’t reach Ademy right now. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
      </div>
    </main>
  </body>
</html>
